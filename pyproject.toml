[project]
name = "observability-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1", "opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
